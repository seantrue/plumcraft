[project]
name = "plumcraft-engine"
version = "0.2.0"
description = "PlumCraft's Python engine SDK and the text engine in Python, speaking protocol 2 over the mode 2 socket binding, with blobs in commonkit"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Sean D. True" }, { name = "Swapwizard LLC" }]
keywords = ["node editor", "node graph", "workflow", "plumcraft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "pyuncommonkit>=0.2.0"]

[project.urls]
Homepage = "https://github.com/seantrue/plumcraft"
Repository = "https://github.com/seantrue/plumcraft"
Issues = "https://github.com/seantrue/plumcraft/issues"
Changelog = "https://github.com/seantrue/plumcraft/blob/main/CHANGELOG.md"

[project.scripts]
plumcraft-text-engine-py = "plumcraft_text.__main__:main"
plumcraft-engine = "plumcraft_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumcraft_engine", "src/plumcraft_text"]

[tool.ruff]
line-length = 160
target-version = "py311"
# tests/golden holds generated projects, checked with their own settings (test_new_engine.py).
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID251"]

# The commonkit hash facade (D10): every digest goes through commonkit.digest (blake3 comes with
# pyuncommonkit). Tests may name an algorithm.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"hashlib".msg = "hash through commonkit.digest (fixed.raw for a fixed algorithm)"
"blake3".msg = "hash through commonkit.digest"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden"]

# `plumcraft-engine run` and `nodes` here drive the Python text engine (plumcraft_engine.cli); a
# generated engine's project names its own.
[tool.plumcraft]
engine = "plumcraft_text:TextEngine"
demo = "../examples/data.json"

[tool.plumcraft.conformance]
slow = "text.slow"
