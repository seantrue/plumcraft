[project]
name = "plumcraft-engine"
version = "0.1.0"
description = "PlumCraft's Python engine SDK and the text engine in Python, speaking protocol 2 over the mode 2 socket binding, with blobs in commonkit"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyuncommonkit>=0.1"]

[project.scripts]
plumcraft-text-engine-py = "plumcraft_text.__main__:main"
plumcraft-engine = "plumcraft_engine.cli:main"

[dependency-groups]
# pillow: generated image engines use it, and test_new_engine.py runs their tests here.
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumcraft_engine", "src/plumcraft_text"]

[tool.ruff]
line-length = 160
target-version = "py311"
# tests/golden holds generated projects, checked with their own settings (test_new_engine.py).
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden"]

# `plumcraft-engine run` and `nodes` here drive the Python text engine (plumcraft_engine.cli); a
# generated engine's project names its own.
[tool.plumcraft]
engine = "plumcraft_text:TextEngine"
demo = "../examples/data.json"

[tool.plumcraft.conformance]
slow = "text.slow"
