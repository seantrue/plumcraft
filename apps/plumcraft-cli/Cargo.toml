[package]
name = "plumcraft"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["node-editor", "workflow", "graph", "cli"]
categories = ["command-line-utilities"]
rust-version.workspace = true
description = "PlumCraft command line: run a workflow on an engine and watch the interface live"

[[bin]]
name = "plumcraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
plumcraft-conform = { workspace = true }
plumcraft-engine = { workspace = true }
plumcraft-graph = { workspace = true }
plumcraft-proto = { workspace = true }
plumcraft-session = { workspace = true }
plumcraft-text = { workspace = true }
serde_json = { workspace = true }
plumcraft-host = { workspace = true }

[dev-dependencies]
plumcraft-scratch = { path = "../../crates/scratch" }
