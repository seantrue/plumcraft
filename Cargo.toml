[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seantrue/plumcraft"

[workspace.dependencies]
zip = { version = "9.3", default-features = false, features = ["deflate"] }
# internal
plumcraft-proto = { path = "crates/proto", version = "=0.4.0" }
plumcraft-engine = { path = "crates/engine", version = "=0.4.0" }
plumcraft-text = { path = "crates/text", version = "=0.4.0" }
plumcraft-array = { path = "crates/array", version = "=0.4.0" }
plumcraft-audio = { path = "crates/audio", version = "=0.4.0" }
plumcraft-craft = { path = "crates/craft", version = "=0.4.0" }
plumcraft-coordinator = { path = "crates/coordinator", version = "=0.4.0" }
plumcraft-host = { path = "crates/host", version = "=0.4.0" }
plumcraft-store = { path = "crates/store", version = "=0.4.0" }
plumcraft-graph = { path = "crates/graph", version = "=0.4.0" }
plumcraft-layout = { path = "crates/layout", version = "=0.4.0" }
plumcraft-session = { path = "crates/session", version = "=0.4.0" }
plumcraft-ui = { path = "crates/ui", version = "=0.4.0" }
plumcraft-automation = { path = "crates/automation", version = "=0.4.0" }
plumcraft-scratch = { path = "crates/scratch", version = "=0.4.0" }
plumcraft-svg = { path = "crates/svg", version = "=0.4.0" }
plumcraft-conform = { path = "crates/conform", version = "=0.4.0" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Engine manifests (plumcraft-proto) and craft packs (plumcraft-craft).
toml = "1"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# Deflate for compressed raw blobs and memo records (plumcraft-store), in pure Rust (miniz_oxide).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# numpy's own host numerics (PCG64 draws, pairwise reductions, histograms, sorts), bit for bit
# (plumcraft-array); from the maintainer's yapocis-rs.
npexact = "0.1.2"
# Draw Text in the array engine: glyph outlines (skrifa, as egui's epaint uses) filled antialiased
# (tiny-skia, as resvg uses); both already in the tree, pure Rust.
skrifa = "0.44"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
# Picture files: the array engine's Load Image and Encode Image (PNG, JPEG, TIFF), and the editor's
# Picture viewer, which also shows WebP and GIF. All pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "gif"] }
# The store's layout, publishing and reading (plumcraft-store). Without `mmap`: segments are
# read, not mapped.
commonkit = { version = "0.1.1", default-features = false }
schemars = "1.2"
tiny_http = "0.12"
# Tokens and nonces from the OS's generator, on every platform (/dev/urandom is Unix-only).
getrandom = "0.3"
ureq = { version = "3", default-features = false }
# The editor UI (plumcraft-ui and plumcraft-editor; plumcraft-view keeps its own until it retires).
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui-snarl = { version = "0.12", features = ["serde"] }
egui_extras = { version = "0.36", default-features = false }
# PDF pages in the viewers (crates/ui/src/viewers/pdf.rs): a pure-Rust PDF rasteriser (Apache-2.0 OR MIT).
hayro = "0.8"
egui_kittest = "0.36"
# Tables as plots in the viewer: 0.37 is the release built on egui 0.36, as the research software uses it.
egui_plot = "0.37"
# Native file dialogs for path widgets (plumcraft-ui only).
rfd = "0.17"
# The XML viewer (plumcraft-ui): the parser usvg already brings in.
roxmltree = "0.20"
# macOS: turn off automatic window tabbing, so a pop-out never becomes a tab of a full-screen
# editor (plumcraft-ui only; the versions eframe and rfd already pull in).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
png = "0.18"
# Control-channel tokens (plumcraft-automation).
uuid = { version = "1", features = ["v4"] }
# The editor's audio view (plumcraft-ui, plan 10.4 F3): spectrograms and playback.
rustfft = "6.4"
cpal = "0.18"
# SVG, a core type (plumcraft-svg: the editor's SVG view and the engine SDK's SVG thumbnails):
# pure Rust, MIT/Apache-2.0 (tiny-skia BSD-3-Clause), the version egui_extras' svg loader already
# pulls in. raster-images draws embedded data: images; text and system-fonts draw text that isn't
# outlined, with the system's fonts (fontdb reads them; memmap-fonts stays off).
resvg = { version = "0.45", default-features = false, features = ["raster-images", "text", "system-fonts"] }
# The audio engine (plumcraft-audio, plan 10.4): SoundCraft's offline DSP and file I/O, pinned at main.
soundcraft-dsp = { git = "https://github.com/storytold/soundcraft", rev = "40f593a360d67f21022c4206df1781952db37e54" }
soundcraft-audio-io = { git = "https://github.com/storytold/soundcraft", rev = "40f593a360d67f21022c4206df1781952db37e54" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
