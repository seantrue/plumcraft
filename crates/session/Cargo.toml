[package]
name = "plumcraft-session"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PlumCraft L3: the editor session and its command registry (every action a command), graph and run commands, run state; lifted from the research software's research-engine"

[lints]
workspace = true

[dependencies]
plumcraft-graph = { workspace = true }
plumcraft-layout = { workspace = true }
plumcraft-store = { workspace = true }
plumcraft-proto = { workspace = true }
# the window's engine connection, for an application's commands (Session::connection)
plumcraft-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# doc.open checks a document against its handle as it copies it; what a trusted workflow is
# known by (fixed SHA-256)
commonkit = { workspace = true }
# workflow bundles
zip = { workspace = true }

[dev-dependencies]
plumcraft-scratch = { path = "../scratch" }
plumcraft-engine = { path = "../engine" }
plumcraft-text = { path = "../text" }
