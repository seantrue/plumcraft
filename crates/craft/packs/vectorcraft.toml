choices = ["blackAndWhite", "grayscale", "color", "logo"]
optional = true
advanced = true
[[node.widget]]
name = "threshold"
type = "INT"
into = "params"
min = 0.0
max = 255.0
optional = true
advanced = true
[[node.widget]]
name = "palette"
