[[node.output]]
name = "map"
type = "JSON"
from = "map"
[[node.widget]]
name = "map"
type = "JSON"
default = []
socket = "both"
[[node.widget]]
name = "order"
type = "BOOL"
default = true
[[node.widget]]
name = "saturationBrightness"
type = "BOOL"
default = false
[[node.widget]]
name = "seed"
type = "INT"
default = 0
min = 0.0
max = 4294967295.0

[[node]]
id = "vc.fill"
