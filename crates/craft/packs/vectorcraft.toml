# The VectorCraft pack for plumcraft-craft (note 14, sections 2.3 and 3.10; D45).
#
# 24 curated nodes (plus vc.expand_appearance, which bakes effects), one generated node per
# built-in effect of `effect.list`, and the vc.run escape hatch over an allowlist. Every key a node
# sends is checked against the command's params grammar when the engine starts; a node the check
# rejects is left out with a log line. `exclude` lists the nodes the smoke test on the corgi
# failed (`plumcraft-craft-engine --craft vectorcraft --smoke <image>`), with why.

id = "vectorcraft"
name = "VectorCraft"
command = ["vectorcraft-cli", "mcp"]
hint = "install vectorcraft-cli on PATH (https://github.com/storytold/vectorcraft)"
timeout_s = 600

# The desktop app: the editor's "Open in VectorCraft" opens a copy of a document value with
# `vectorcraft <file>` (plan 10.6, M3). PLUMCRAFT_VECTORCRAFT_APP names another build.
[gui]
command = ["vectorcraft"]
env = "PLUMCRAFT_VECTORCRAFT_APP"
label = "VectorCraft"
hint = "install vectorcraft on PATH (https://github.com/storytold/vectorcraft)"

# Saves stamp File Info's `created`/`modified` with the clock unless SOURCE_DATE_EPOCH pins it
# (vectorcraft crates/doc/src/metadata.rs `output_time`): without it two saves a second apart
# differ, and a document handle would not be stable (D43).
[env]
SOURCE_DATE_EPOCH = "0"

[roots]
read = "--automation-read-root"
write = "--automation-write-root"

[pool]
max = 4
idle_s = 60
clear_every = 20

[tools]
list = "command_list"
run = { tool = "command_run", id = "id", params = "params" }

[actions]
open = { command = "document.open", path = "path" }
save = { command = "document.save", path = "path", params = { compress = false } }
close_all = { command = "file.closeAll" }
clear_history = { command = "edit.clearHistory" }
export = { command = "document.export", path = "path" }

[selection]
all = "select.all"
none = "select.none"
set = "select.set"
color = "select.color"
find = "document.find"

[doc]
wire = "vectorcraft.doc"
opens_svg = true
ext = "vectorcraft"
media = "application/vnd.vectorcraft+json"
app = "vectorcraft"
stem = "document"

[thumb]
px = 120
size_command = "document.inspect"
size_params = { depth = 0 }

[[catalogue]]
name = "effects"
command = "effect.list"
path = "catalog"

[[catalogue]]
name = "presets"
command = "imageTrace.presets"
path = "presets"

[[catalogue]]
name = "formats"
command = "document.formats"
path = "formats"

[[generate]]
catalogue = "effects"
prefix = "vc.fx."
command = "effect.apply"
key = "effect"
params_key = "params"
family = "Effect"
select = "all"

[run_node]
id = "vc.run"
display = "Run command"
allow = ["object.", "path.", "paint.", "stroke.", "recolor.", "effect.", "artboard.", "imageTrace.", "shape.", "type.createOutlines", "layer.flatten", "swatch.addUsedColors", "document.find", "document.inspect", "edit.clear"]
deny = ["object.liquify", "object.puppetWarp", "path.knife", "path.freehand", "paint.sampleColor", "imageTrace.setView", "effect.list", "object.place", "object.relink", "object.embed", "object.unembed", "object.exportSelection", "object.collectForExport", "object.export"]

# ---- documents ----

[[node]]
id = "vc.open"
display = "Open"
kind = "open"
family = "Document"
description = "Open an image, an SVG, a PDF or a VectorCraft document (document.open)"
[[node.widget]]
name = "cropTo"
type = "ENUM"
choices = ["bounding", "art", "crop", "trim", "bleed", "media"]
optional = true
advanced = true
[[node.widget]]
name = "pages"
type = "STRING"
optional = true
advanced = true

[[node]]
id = "vc.new"
display = "New document"
kind = "new"
family = "Document"
command = "file.new"
description = "A new document (file.new, with File Info's created date pinned and a fixed name, so it is reproducible)"
fixed = { created = 0 }
[[node.widget]]
name = "name"
type = "STRING"
default = "Untitled"
advanced = true
[[node.widget]]
name = "width"
type = "FLOAT"
default = 612.0
min = 1.0
max = 16383.0
[[node.widget]]
name = "height"
type = "FLOAT"
default = 792.0
min = 1.0
max = 16383.0
[[node.widget]]
name = "units"
type = "ENUM"
choices = ["Pixels", "Points", "Picas", "Inches", "Millimeters", "Centimeters", "Feet", "Yards", "Meters", "Feet & Inches"]
default = "Points"
[[node.widget]]
name = "colorMode"
type = "ENUM"
choices = ["rgb", "cmyk"]
default = "rgb"
[[node.widget]]
name = "artboards"
type = "INT"
default = 1
min = 1.0
max = 1000.0

[[node]]
id = "vc.fit_artboard"
display = "Fit artboard to art"
kind = "transform"
family = "Document"
command = "artboard.fitToArt"
[[node.widget]]
name = "index"
type = "INT"
default = 0
min = 0.0
max = 999.0

