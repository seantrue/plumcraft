into = "params"
min = 0.0
max = 100.0
optional = true
advanced = true
[[node.widget]]
name = "corners"
type = "FLOAT"
into = "params"
min = 0.0
max = 100.0
optional = true
advanced = true
[[node.widget]]
name = "noise"
type = "INT"
into = "params"
min = 0.0
max = 1000.0
optional = true
advanced = true
[[node.widget]]
name = "method"
type = "ENUM"
into = "params"
choices = ["abutting", "overlapping"]
optional = true
advanced = true
[[node.widget]]
name = "ignoreWhite"
type = "BOOL"
into = "params"
optional = true
advanced = true
[[node.widget]]
name = "snapCurvesToLines"
type = "BOOL"
into = "params"
optional = true
advanced = true
[[node.widget]]
name = "shapes"
type = "BOOL"
into = "params"
optional = true
advanced = true
[[node.widget]]
name = "autoGrouping"
type = "BOOL"
into = "params"
optional = true
advanced = true
[[node.widget]]
name = "gradients"
type = "BOOL"
into = "params"
optional = true
advanced = true
[[node.widget]]
name = "fills"
type = "BOOL"
into = "params"
optional = true
advanced = true
[[node.widget]]
name = "strokes"
type = "BOOL"
into = "params"
optional = true
advanced = true
[[node.widget]]
name = "strokeWidth"
type = "FLOAT"
into = "params"
min = 0.0
max = 1000.0
optional = true
