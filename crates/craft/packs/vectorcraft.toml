# ---- export ----

[[node]]
id = "vc.export_svg"
display = "Export SVG"
kind = "export"
family = "Export"
format = "svg"
ext = "svg"
media = "image/svg+xml"
options_from = "formats:svg"
options = ["decimals", "embedFonts", "outlineText", "artboard"]
[[node.output]]
name = "svg"
type = "SVG"

[[node]]
id = "vc.export_png"
display = "Export PNG"
kind = "export"
family = "Export"
format = "png"
ext = "png"
media = "image/png"
options_from = "formats:png"
options = ["scale", "background", "antiAlias", "artboard"]
[[node.output]]
name = "image"
type = "IMAGE"

[[node]]
id = "vc.export_pdf"
display = "Export PDF"
kind = "export"
family = "Export"
format = "pdf"
ext = "pdf"
media = "application/pdf"
pure = false
options_from = "formats:pdf"
options = ["preset", "range", "compatibility"]
[[node.output]]
name = "pdf"
type = "PDF"

[exclude]

[smoke_base]
node = "vc.trace"
values = { preset = "6 Colors" }

# Fair smoke tests where the defaults on the traced corgi have nothing to act on.
[smoke."vc.trace"]
raster = true
values = { preset = "6 Colors" }

[smoke."vc.mosaic"]
raster = true

[smoke."vc.outline_stroke"]
before = ["vc.stroke"]

[smoke."vc.expand"]
before = ["vc.stroke"]

[smoke."vc.expand_appearance"]
before = ["vc.fx.stylize.dropShadow"]

[smoke."vc.halftone"]
values = { frequency = 4.0 }

[smoke."vc.fx.threeD.extrude"]
values = { select = 'json:{"kind": "Path", "limit": 1}' }

[smoke."vc.fx.threeD.inflate"]
values = { select = 'json:{"kind": "Path", "limit": 1}' }

[smoke."vc.fx.threeD.revolve"]
values = { select = 'json:{"kind": "Path", "limit": 1}' }

[smoke."vc.fx.threeD.rotate"]
values = { select = 'json:{"kind": "Path", "limit": 1}' }
