into = "params"
choices = ["limited", "fullTone", "automatic", "documentLibrary"]
optional = true
advanced = true
[[node.widget]]
name = "colors"
type = "INT"
into = "params"
min = 2.0
max = 256.0
optional = true
advanced = true
[[node.widget]]
name = "colorDetail"
type = "FLOAT"
into = "params"
min = 0.0
max = 100.0
optional = true
advanced = true
[[node.widget]]
