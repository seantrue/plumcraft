[[node]]
id = "vc.colors"
display = "Colours"
kind = "query"
family = "Colour"
command = "recolor.colors"
description = "The colours the selected objects use, most used first (recolor.colors)"
select = "all"
[[node.output]]
name = "colors"
type = "JSON"
from = "colors"

[[node]]
id = "vc.recolor"
display = "Recolor"
kind = "transform"
family = "Colour"
command = "recolor.apply"
description = "Recolour the art by a map of colours (recolor.apply); wire vc.colors or vc.reduce_colors into map"
select = "all"
[[node.widget]]
name = "map"
type = "JSON"
default = []
socket = "both"
[[node.widget]]
name = "method"
type = "ENUM"
choices = ["exact", "preserveTints", "scaleTints", "tintsShades", "hueShift"]
optional = true
[[node.widget]]
name = "limitTo"
type = "STRING"
optional = true
advanced = true
[[node.widget]]
name = "includeImages"
type = "BOOL"
default = true
advanced = true
[[node.widget]]
name = "includePatterns"
type = "BOOL"
default = true
advanced = true

[[node]]
id = "vc.reduce_colors"
display = "Reduce colours"
kind = "transform"
family = "Colour"
command = "recolor.reduce"
select = "all"
[[node.output]]
name = "map"
type = "JSON"
from = "map"
[[node.widget]]
name = "colors"
type = "INT"
min = 1.0
max = 256.0
optional = true
[[node.widget]]
name = "method"
type = "ENUM"
choices = ["exact", "preserveTints", "scaleTints", "tintsShades", "hueShift"]
optional = true
[[node.widget]]
name = "preserve"
type = "JSON"
optional = true
