# ---- export (the export command) ----

[[node]]
id = "cad.export_svg"
display = "Export SVG"
kind = "export"
family = "Export"
format = "svg"
ext = "svg"
media = "image/svg+xml"
[[node.output]]
name = "svg"
type = "SVG"

[[node]]
id = "cad.export_png"
display = "Export PNG"
kind = "export"
family = "Export"
format = "png"
ext = "png"
media = "image/png"
[[node.output]]
name = "image"
type = "IMAGE"

[[node]]
id = "cad.export_pdf"
display = "Export PDF"
kind = "export"
family = "Export"
format = "pdf"
ext = "pdf"
media = "application/pdf"
[[node.output]]
name = "pdf"
type = "PDF"

[[node]]
id = "cad.export_dwg"
display = "Export DWG"
kind = "export"
family = "Export"
description = "The drawing as DWG (export); no viewer in the editor"
format = "dwg"
ext = "dwg"
media = "image/vnd.dwg"
[[node.output]]
name = "dwg"
type = "DWG"
