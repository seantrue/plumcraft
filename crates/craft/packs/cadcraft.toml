pure = false
family = "Modify"
command = "mirror"
select = "all"
[[node.widget]]
name = "p1"
type = "JSON"
default = [0, 0]
[[node.widget]]
name = "p2"
type = "JSON"
default = [0, 1]
[[node.widget]]
name = "erase"
type = "BOOL"
default = false

[[node]]
id = "cad.array_rect"
display = "Rectangular array"
kind = "transform"
pure = false
family = "Modify"
command = "arrayrect"
select = "all"
fixed = { associative = false }
[[node.widget]]
name = "rows"
type = "INT"
default = 2
min = 1.0
max = 10000.0
[[node.widget]]
name = "cols"
type = "INT"
default = 2
min = 1.0
max = 10000.0
[[node.widget]]
name = "rowSpacing"
label = "row spacing"
type = "FLOAT"
default = 100.0
min = -1000000.0
max = 1000000.0
[[node.widget]]
name = "colSpacing"
label = "column spacing"
type = "FLOAT"
default = 100.0
min = -1000000.0
max = 1000000.0

[[node]]
id = "cad.array_polar"
display = "Polar array"
kind = "transform"
pure = false
family = "Modify"
command = "arraypolar"
select = "all"
fixed = { associative = false }
[[node.widget]]
name = "center"
type = "JSON"
default = [0, 0]
[[node.widget]]
name = "count"
type = "INT"
default = 6
min = 1.0
max = 10000.0
[[node.widget]]
name = "angle"
type = "FLOAT"
default = 360.0
min = -360.0
max = 360.0
[[node.widget]]
name = "rotate"
type = "BOOL"
default = true

[[node]]
id = "cad.explode"
display = "Explode"
kind = "transform"
pure = false
family = "Modify"
command = "explode"
select = "all"

[[node]]
id = "cad.properties"
display = "Properties"
