kind = "transform"
pure = false
family = "Draw"
command = "pline"
[[node.widget]]
name = "vertices"
type = "JSON"
default = [[0, 0], [100, 0], [100, 50], [0, 50]]
[[node.widget]]
name = "closed"
type = "BOOL"
default = true
[[node.widget]]
name = "width"
type = "FLOAT"
min = 0.0
max = 100000.0
optional = true

[[node]]
id = "cad.rectangle"
display = "Rectangle"
kind = "transform"
pure = false
family = "Draw"
command = "rectang"
[[node.widget]]
name = "p1"
type = "JSON"
default = [0, 0]
[[node.widget]]
name = "p2"
type = "JSON"
default = [100, 60]
[[node.widget]]
name = "fillet"
type = "FLOAT"
min = 0.0
max = 100000.0
optional = true
[[node.widget]]
name = "rotation"
type = "FLOAT"
min = -360.0
max = 360.0
optional = true

[[node]]
id = "cad.circle"
display = "Circle"
kind = "transform"
pure = false
family = "Draw"
command = "circle"
[[node.widget]]
name = "center"
type = "JSON"
default = [0, 0]
[[node.widget]]
name = "radius"
type = "FLOAT"
default = 10.0
min = 0.0
max = 1000000.0

[[node]]
id = "cad.polygon"
display = "Polygon"
kind = "transform"
pure = false
family = "Draw"
command = "polygon"
[[node.widget]]
name = "sides"
type = "INT"
default = 6
min = 3.0
max = 1024.0
[[node.widget]]
name = "center"
type = "JSON"
default = [0, 0]
[[node.widget]]
name = "radius"
type = "FLOAT"
default = 10.0
min = 0.0
max = 1000000.0
[[node.widget]]
name = "inscribed"
type = "BOOL"
optional = true

[[node]]
id = "cad.text"
display = "Text"
kind = "transform"
pure = false
family = "Draw"
command = "text"
[[node.widget]]
name = "at"
type = "JSON"
default = [0, 0]
[[node.widget]]
name = "text"
type = "STRING"
default = "Text"
[[node.widget]]
name = "height"
type = "FLOAT"
default = 5.0
min = 0.0
max = 100000.0
[[node.widget]]
name = "rotation"
type = "FLOAT"
min = -360.0
max = 360.0
optional = true
[[node.widget]]
name = "justify"
type = "ENUM"
choices = ["L", "C", "R", "M", "TL", "TC", "TR", "ML", "MC", "MR", "BL", "BC", "BR"]
optional = true

[[node]]
id = "cad.dim_linear"
display = "Linear dimension"
kind = "transform"
pure = false
family = "Draw"
command = "dimlinear"
[[node.widget]]
name = "p1"
type = "JSON"
default = [0, 0]
[[node.widget]]
name = "p2"
type = "JSON"
default = [100, 0]
[[node.widget]]
name = "at"
type = "JSON"
default = [50, -10]

[[node]]
id = "cad.hatch"
display = "Hatch"
kind = "transform"
pure = false
family = "Draw"
command = "hatch"
description = "Hatch the closed areas around these internal points (hatch)"
[[node.widget]]
name = "points"
type = "JSON"
default = [[1, 1]]
[[node.widget]]
name = "pattern"
type = "STRING"
default = "ANSI31"
[[node.widget]]
name = "scale"
type = "FLOAT"
min = 0.0001
max = 100000.0
optional = true

# ---- modify (on `select`, default all) ----

[[node]]
id = "cad.move"
display = "Move"
kind = "transform"
pure = false
family = "Modify"
command = "move"
select = "all"
[[node.widget]]
name = "delta"
type = "JSON"
default = [0, 0]

[[node]]
id = "cad.rotate"
