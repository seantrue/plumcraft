# The CADCraft pack (Worker B, 2026-10-28; note 14, 3.10).
#
# CADCraft's document is a DXF drawing (`saveas`/`open`; DWG is an export). Its `mcp` server has
# no automation roots, so this craft is NOT confined to the CAS and the work folder: it can read
# and write anywhere the user can. Drawing nodes take explicit coordinates (drawing units, y up);
# modify nodes act on `select` (default all). Exports go through the `export` command (SVG, PNG,
# PDF, DWG, DXF; all byte-stable).
#
# A new drawing's first save lacks some header variables that `open` fills in ($CHAMFERA, …), so
# open → save is the identity only after one round trip: a chain run warm and the same chain run
# cold can differ in those header lines. The memo would see that (D47), so `new` and every
# transform are `pure = false` (memo scope none) until the adapter can save-reopen-save
# (see claude-debug/craft-pack-cadcraft.md). Queries and exports stay pure.

id = "cadcraft"
name = "CADCraft"
# The pack's own version, and the app versions it was made and checked for (B17, #56).
pack_version = "1"
app_versions = ">=0.17.1"
command = ["cadcraft-cli", "mcp", "--config-dir", ""]
hint = "install cadcraft-cli on PATH (https://github.com/storytold/cadcraft)"
timeout_s = 300

# The desktop app: "Open in CADCraft" opens a copy of a drawing with `cadcraft <file>`.
# PLUMCRAFT_CADCRAFT_APP names another build.
[gui]
command = ["cadcraft"]
env = "PLUMCRAFT_CADCRAFT_APP"
label = "CADCraft"
hint = "install cadcraft on PATH (https://github.com/storytold/cadcraft)"

[pool]
max = 2

[tools]
list = "list_commands"
run = { tool = "execute", id = "command", params = "params" }

[actions]
open = { command = "open", path = "path" }
save = { command = "saveas", path = "path" }
close_all = { command = "closeall" }
export = { command = "export", path = "path" }

# `select` takes hex handles under `handles` (`set_key`). `string_ids` keeps every id in
# `select = "ids:…"` a string, so an all-digit handle (`ids:101`) is 0x101; CADCraft would read a
# number as a decimal handle (101 → 0x65) and select the wrong object.
[selection]
all = "selectall"
none = "ai_deselect"
set = "select"
set_key = "handles"
string_ids = true

[doc]
wire = "cadcraft.dxf"
ext = "dxf"
media = "image/vnd.dxf"
app = "cadcraft"
stem = "drawing"
color = "#0369a1"

[run_node]
id = "cad.run"
display = "Run command"
allow = [
    "line", "pline", "circle", "circle.", "arc", "arc.", "rectang", "polygon", "ellipse", "ellipse.", "point", "point.multiple", "xline", "ray",
    "spline", "donut", "text", "mtext", "divide", "measure", "revcloud", "revcloud.polygonal", "centermark", "centerline", "wipeout",
    "dimlinear", "dimaligned", "dimradius", "dimdiameter", "dimangular", "dimarc", "dimordinate", "dimcontinue", "dimbaseline", "qdim", "mleader", "leader",
    "hatch", "gradient", "boundary", "region", "union", "subtract", "intersect",
    "erase", "move", "copy", "rotate", "scale", "mirror", "stretch", "offset", "trim", "extend", "fillet", "chamfer", "explode", "break", "breakatpoint", "join",
    "array", "arrayrect", "arraypolar", "pedit", "lengthen", "align", "reverse", "overkill", "purge",
    "layer.new", "layer.set", "layer.current", "properties.set", "matchprop", "draworder.", "group", "ungroup",
    "selectall", "ai_deselect", "select", "drawing.inspect", "entities", "texts", "count", "area", "dist", "list", "massprop",
    "table", "table.set", "block", "insert", "blocks.list",
]
# Not allowed even if a prefix above grows to cover them: files, the clipboard, scripts and LISP,
# settings, plotting and sharing.
deny = ["lisp", "appload", "script", "setvar", "options", "aliasedit", "copyclip", "cutclip", "pasteclip", "wblock", "bsave", "xattach", "import", "export", "plot", "publish", "share"]

# ---- documents ----

[[node]]
id = "cad.new"
display = "New drawing"
kind = "new"
pure = false
family = "Drawing"
command = "new"
description = "A new, empty drawing (new, with no template)"
fixed = { template = "." }
[[node.widget]]
name = "metric"
type = "BOOL"
default = true

[[node]]
id = "cad.open"
display = "Open"
kind = "open"
family = "Drawing"
description = "Open a DXF or DWG file (open)"

[[node]]
id = "cad.inspect"
display = "Inspect drawing"
kind = "query"
family = "Drawing"
command = "drawing.inspect"
[[node.widget]]
name = "entities"
type = "BOOL"
default = false
[[node.widget]]
name = "limit"
type = "INT"
default = 100
min = 0.0
max = 100000.0
advanced = true

[[node]]
id = "cad.entities"
display = "Entities"
kind = "query"
family = "Drawing"
command = "entities"
description = "The drawing's entities, filtered by type and layer (entities)"
[[node.output]]
name = "count"
type = "INT"
from = "count"
[[node.output]]
name = "entities"
type = "JSON"
from = "entities"
[[node.widget]]
name = "type"
type = "STRING"
optional = true
[[node.widget]]
name = "layer"
type = "STRING"
optional = true
[[node.widget]]
name = "limit"
type = "INT"
default = 100
min = 0.0
max = 100000.0

[[node]]
id = "cad.layer"
display = "New layer"
kind = "transform"
pure = false
family = "Drawing"
command = "layer.new"
description = "A new layer, made current so the next objects go on it (layer.new)"
[[node.widget]]
name = "name"
type = "STRING"
default = "Layer1"
[[node.widget]]
name = "color"
type = "STRING"
default = "red"
[[node.widget]]
name = "current"
type = "BOOL"
default = true

# ---- draw ----

[[node]]
id = "cad.line"
display = "Line"
kind = "transform"
pure = false
family = "Draw"
command = "line"
[[node.widget]]
name = "points"
type = "JSON"
default = [[0, 0], [100, 0], [100, 50]]
[[node.widget]]
name = "closed"
type = "BOOL"
default = false

[[node]]
