# The PhotoCraft pack for plumcraft-craft (note 14, 3.10): a raster image editor
# (Photoshop-class) as PlumCraft nodes. Worker A, 2026-10-28; notes in
# claude-debug/craft-pack-photocraft.md.
#
# The document is PhotoCraft's native `.pcraft` (a stored zip; the same document saved under the
# same file name is byte-identical, so handles are stable). Open and save are the `doc_open` /
# `doc_save` tools; exports are `doc_export` with `format` as an extension. Filters and
# adjustments act on the active layer (an opened JPEG/PNG is one layer; `pc.flatten` merges).
#
# `close_all` is `file.closeAll`, which fails with "not available right now: no document open"
# when nothing is open; the adapter then starts a fresh process instead (and skips the reset on
# a process that has run nothing), so every cold open starts from no documents.

id = "photocraft"
name = "PhotoCraft"
command = ["photocraft-cli", "mcp"]
hint = "install photocraft-cli on PATH (https://github.com/storytold/photocraft)"
timeout_s = 600

[gui]
command = ["photocraft"]
env = "PLUMCRAFT_PHOTOCRAFT_APP"
label = "PhotoCraft"
hint = "install photocraft on PATH (~/bin/photocraft)"

[roots]
read = "--automation-read-root"
write = "--automation-write-root"

[pool]
max = 2
idle_s = 60
clear_every = 20

[tools]
list = "command_list"
run = { tool = "command_run", id = "id", params = "params" }

[actions]
open = { tool = "doc_open", path = "path" }
save = { tool = "doc_save", path = "path" }
close_all = { command = "file.closeAll" }
clear_history = { command = "history.clear" }
export = { tool = "doc_export", path = "path" }

[doc]
wire = "photocraft.doc"
ext = "pcraft"
media = "application/vnd.photocraft"
app = "photocraft"
stem = "document"
color = "#0e7490"

[run_node]
id = "pc.run"
display = "Run command"
allow = ["filter.", "image.adjustments.", "image.imageRotation.", "image.rotation.", "image.autoTone", "image.autoContrast", "image.autoColor", "image.crop", "image.trim", "image.imageSize", "image.canvasSize", "image.mode.", "image.revealAll", "image.detectFaces", "layer.", "select.", "shape.", "type.", "path.", "document.inspect", "edit.fill", "edit.stroke", "edit.clear", "edit.transform.", "edit.contentAwareFill", "edit.contentAwareScale", "edit.fade"]
deny = [
  # files, app libraries and the clipboard
  "layer.smartObjects.", "layer.videoLayers.", "shape.presets.", "layer.layerStyle.contours.",
  "layer.quickExportAsPng", "layer.exportAs", "layer.copyToDocument",
  "type.fonts", "type.saveDefaultTypeStyles", "type.loadDefaultTypeStyles", "type.replaceAllMissingFonts", "type.resolveMissingFonts",
  "path.style.copyFill", "path.style.copyStroke", "path.style.pasteFill", "path.style.pasteStroke",
  "layer.layerStyle.copyLayerStyle", "layer.layerStyle.pasteLayerStyle",
  # ids with words the pack policy denies (harmless in-document edits, denied for the rule's sake)
  "layer.delete", "layer.delete.hiddenLayers", "layer.layerMask.delete", "layer.vectorMask.delete", "layer.smartFilter.delete", "layer.smartFilter.deleteFilterMask",
  "path.delete", "path.deleteAnchor", "type.characterStyle.delete", "type.paragraphStyle.delete",
  "layer.arrange.sendBackward", "layer.arrange.sendToBack",
]

# ---- documents ----

[[node]]
id = "pc.open"
display = "Open"
kind = "open"
family = "Document"
description = "Open an image (PNG, JPEG, TIFF, PSD, WebP, EXR, …) or a PhotoCraft document (doc_open)"

[[node]]
id = "pc.new"
display = "New document"
kind = "new"
family = "Document"
command = "file.new"
description = "A new document (file.new) with a fixed name, so it is reproducible"
fixed = { name = "Untitled" }
[[node.widget]]
name = "width"
type = "INT"
default = 1024
min = 1.0
max = 300000.0
[[node.widget]]
name = "height"
type = "INT"
default = 768
min = 1.0
max = 300000.0
[[node.widget]]
name = "mode"
type = "ENUM"
choices = ["rgb", "grayscale", "cmyk", "lab"]
default = "rgb"
[[node.widget]]
name = "depth"
type = "INT"
choices = [8, 16, 32]
default = 8
advanced = true
[[node.widget]]
name = "background"
type = "STRING"
default = "white"
tooltip = "white, black, transparent or #rrggbb"
[[node.widget]]
name = "resolution"
type = "FLOAT"
default = 72.0
min = 1.0
max = 30000.0
advanced = true

[[node]]
id = "pc.inspect"
display = "Inspect"
kind = "query"
family = "Document"
command = "document.inspect"
description = "The document's size, mode, layers, channels and history (document.inspect)"

[[node]]
id = "pc.flatten"
display = "Flatten image"
kind = "transform"
family = "Document"
command = "layer.flattenImage"

# ---- image ----

[[node]]
id = "pc.image_size"
display = "Image size"
