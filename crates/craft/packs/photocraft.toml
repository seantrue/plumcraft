[[node]]
id = "pc.crop"
display = "Crop"
kind = "transform"
family = "Image"
command = "image.crop"
[[node.widget]]
name = "x"
type = "INT"
default = 0
min = -300000.0
max = 300000.0
[[node.widget]]
name = "y"
type = "INT"
default = 0
min = -300000.0
max = 300000.0
[[node.widget]]
name = "width"
type = "INT"
default = 512
min = 1.0
max = 300000.0
[[node.widget]]
name = "height"
type = "INT"
default = 512
min = 1.0
max = 300000.0

[[node]]
id = "pc.rotate"
