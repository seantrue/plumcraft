type = "FLOAT"
min = 0.05
max = 1.0
optional = true
[[node.widget]]
name = "crf"
type = "INT"
min = 0.0
max = 51.0
optional = true
advanced = true
[[node.widget]]
name = "audio"
type = "BOOL"
default = true
[[node.widget]]
name = "range"
type = "ENUM"
choices = ["entire", "inOut", "workArea", "custom"]
optional = true
advanced = true
[[node.widget]]
name = "startSeconds"
type = "FLOAT"
min = 0.0
optional = true
advanced = true
[[node.widget]]
name = "endSeconds"
type = "FLOAT"
min = 0.0
optional = true
advanced = true
[[node.widget]]
name = "width"
type = "INT"
min = 16.0
max = 8192.0
tooltip = "Frame width in pixels; unset: the sequence's"
optional = true
advanced = true
[[node.widget]]
name = "height"
type = "INT"
min = 16.0
max = 8192.0
tooltip = "Frame height in pixels; unset: the sequence's"
optional = true
advanced = true
[[node.widget]]
name = "fps"
type = "FLOAT"
min = 1.0
max = 240.0
tooltip = "Frame rate; unset: the sequence's"
optional = true
advanced = true
[[node.widget]]
name = "bitrateMode"
type = "ENUM"
choices = ["cbr", "vbr1Pass", "vbr2Pass", "crf"]
optional = true
advanced = true
[[node.widget]]
name = "bitrateKbps"
