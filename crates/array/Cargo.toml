npexact = { workspace = true }
image = { workspace = true }
skrifa = { workspace = true }
tiny-skia = { workspace = true }
plumcraft-svg = { workspace = true }
base64 = { workspace = true }
hayro = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
plumcraft-scratch = { path = "../scratch" }
plumcraft-host = { path = "../host" }
plumcraft-store = { path = "../store" }

[build-dependencies]
md-5 = { workspace = true }
