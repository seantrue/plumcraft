# cargo-about's configuration for PlumCraft's acknowledgements (FR4, research note 29): the
# licences accepted are exactly those found when the list was made (a new one fails until it is
# added here, after a look); `bash scripts/acknowledgements.sh` makes the list. The build, the
# tests and CI never run it: the list it writes is checked in, and a test fails when Cargo.lock
# changed since.
# in the order of preference: where a crate offers a choice the first of these it offers is
# taken (decision 5A: the permissive option; `self_cell` as Apache-2.0, never the GPL)
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["aarch64-apple-darwin", "aarch64-apple-ios", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Crates published without their licence file (research note 29). Each clarification names the
# file and its SHA-256, so a different file fails. `git` files are fetched from the crate's own
# repository at the commit it was published from (`.cargo_vcs_info.json`), online, when the list
# is made; `files` are in the package (or, for a git dependency, its checkout). Still shown with
# the licence's standard text, as nothing better was found: dispatch 0.2.0 and egui-scale 0.6.1
# (no file in their repositories), dasp_sample 0.11.0 (its repository address ends in `.git`,
# which cargo about can't fetch from), zune-core 0.4.12 (no repository address), and the older
# versions of block2, objc2, objc2-app-kit, objc2-foundation and objc2-ui-kit (another file name
# than the newer version's).

