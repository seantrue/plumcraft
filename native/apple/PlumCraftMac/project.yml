# Plummer, PlumCraft's native editor for the Mac (N3 slice 3; named Plummer 2026-11-21; docs/research/24-native-shells.md section 18): a document-based
# AppKit app on the Swift kit (../PlumCraftFFI) and its layer canvas. Generate with
# `xcodegen generate`; build, run and check with ./run.sh, ./conformance.sh and ./bench.sh.
# The generated PlumCraftMac.xcodeproj and App/Info.plist are not committed (see .gitignore).
name: PlumCraftMac
options:
  bundleIdPrefix: com.plumcraft
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  PlumCraftFFI:
    path: ../PlumCraftFFI
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  PlumCraftMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Plummer
        CFBundleDisplayName: Plummer
        # both from the build settings (../Config/Version.xcconfig; the release script passes them)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        # export compliance (the maintainer, 2026-11-21, card 1A: "Answer No: exempt (reading a
        # document only)"): no TLS, only the OS's random numbers, hashing, and hayro's PDF
        # decryption, which only reads a document (claude-debug/native-n4-apple-prep.md section 4;
        # not legal advice)
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plummer Graph
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
            NSDocumentClass: GraphDocument
    # signing, the hardened runtime and versions (Config/Mac.xcconfig; a local, untracked
    # Config/Signing.local.xcconfig or the environment names the team and identity)
    configFiles:
      Debug: ../Config/Mac.xcconfig
      Release: ../Config/Mac.xcconfig
    # the engine programs beside the app's own (Contents/MacOS, where the core looks for them):
    # only when PLUMCRAFT_ENGINES_DIR names a folder of them (release.sh builds it); a build
    # without it has none, and starts engines in process or from the cargo build, as before
    postBuildScripts:
      - name: Bundle engines
        basedOnDependencyAnalysis: false
        script: |
          [ -n "${PLUMCRAFT_ENGINES_DIR:-}" ] || exit 0
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          for e in plumcraft-text-engine plumcraft-array-engine plumcraft-audio-engine plumcraft-craft-engine; do
            [ -x "$PLUMCRAFT_ENGINES_DIR/$e" ] || { echo "error: no engine at $PLUMCRAFT_ENGINES_DIR/$e"; exit 1; }
            cp -f "$PLUMCRAFT_ENGINES_DIR/$e" "$dest/$e"
            # nested code is signed before the app seals it, with the app's identity and runtime
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp=none "$dest/$e"
          done
    dependencies:
      - package: PlumCraftFFI
        product: PlumCraftKit
      - package: PlumCraftFFI
        product: PlumCraftCanvas
      - package: PlumCraftFFI
        product: PlumCraftShell
    settings:
      base:
        PRODUCT_NAME: Plummer
        PRODUCT_MODULE_NAME: PlumCraftMac
        PRODUCT_BUNDLE_IDENTIFIER: $(PLUMMER_MAC_BUNDLE_ID)
        ARCHS: arm64
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bundle engines reads PLUMCRAFT_ENGINES_DIR, outside the project
        ENABLE_USER_SCRIPT_SANDBOXING: NO
