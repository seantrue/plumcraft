# The gate from AGENTS.md, on every pull request and every push to main. A PR merges only once
# both jobs pass (branch protection names `gate` and `python`).
#
# A change to the bookkeeping Markdown alone (the bug list, status, the AI ledger, the
# changelog, the roadmap) needs no CI: no code reads those files (maintainer, 2026-11-06:
# "Pushing BUGS.md should not require a CI cycle"). Nor does one to packaging/ alone, which CI
# never runs ("Uploading installers should not require a CI cycle"). A push of only those files to main starts
# nothing. A pull request still starts the workflow, since branch protection waits for `gate`
# and `python`, but `changes` finds nothing else changed and both are skipped, which counts as
# passing. Keep the two lists below the same.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - docs/BUGS.md
      - docs/STATUS.md
      - AI.md
      - CHANGELOG.md
      - ROADMAP.md
      - packaging/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The least disk: no debug info (the global build rules), and no incremental state in CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # commonkit's store declines to publish under 8 GB free, and after the build the runner has
  # less, so blobs (watched audio, large JSON) would never cross (docs/BUGS.md B7, B9).
  COMMONKIT_STORE_MIN_FREE_GB: 2

# Linux only: macOS runners cost too much (maintainer, 2026-11-05). macOS is checked locally.
jobs:
  # Whether anything but the bookkeeping Markdown changed: always, except for a pull request
  # that touches only those files.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          other=$(git diff --name-only "$BASE...$HEAD" | grep -v -x -E 'docs/BUGS\.md|docs/STATUS\.md|AI\.md|CHANGELOG\.md|ROADMAP\.md|packaging/.*' || true)
          if [ -n "$other" ]; then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"
          echo "changed besides the bookkeeping Markdown:"; echo "${other:-(nothing)}"

  # The Rust half: fmt, clippy and every test, the test binaries run in parallel by nextest.
  gate:
    name: gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA's headers for the audio engine; Mesa's software Vulkan (lavapipe) as the GPU the
      # rendering kittests need, since the runner has none ("No adapter found"). Cached, as
      # Ubuntu's mirrors sometimes take minutes to answer.
      - name: Linux packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev mesa-vulkan-drivers libvulkan1
          version: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # the Rust tests that build Python engines (engine_manifest, generated_engine) use uv
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # every test binary in parallel, each test in its own process; --no-fail-fast lists every
      # failing test in one run. There are no doc tests (cargo test --doc finds none). Once per
      # hash algorithm, each with a fresh store root, mark folder and craft root inside a fresh
      # run folder (the commonkit hash facade); a leaked foreign or bad key fails the run.
      - name: cargo nextest, under md5 and then b3
        run: |
          for algo in md5 b3; do
            run=$(mktemp -d)
            COMMONKIT_HASH=$algo COMMONKIT_TEST_RUN=$run COMMONKIT_STORE_ROOT=$run/store \
              COMMONKIT_MARK_DIR=$run/marks PLUMCRAFT_CRAFT_ROOT=$run/craft \
              cargo nextest run --all-features --no-fail-fast
            if ls "$run/marks" 2>/dev/null | grep -E 'shm_(foreign_digest|bad_key)'; then exit 1; fi
          done

      # Every digest goes through commonkit::digest (D10).
      - name: hash gates
        if: ${{ !cancelled() }}
        run: scripts/check-hash-gates.sh

  # The Python SDK's tests and lint: they don't use the Rust build, so they run beside it.
  python:
    name: python
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: pytest, under md5 and then b3
        working-directory: python
        run: |
          for algo in md5 b3; do
            run=$(mktemp -d)
            COMMONKIT_HASH=$algo COMMONKIT_TEST_RUN=$run COMMONKIT_STORE_ROOT=$run/store \
              COMMONKIT_MARK_DIR=$run/marks uv run pytest
            if ls "$run/marks" 2>/dev/null | grep -E 'shm_(foreign_digest|bad_key)'; then exit 1; fi
          done

      - name: ruff
        if: ${{ !cancelled() }}
        working-directory: python
        run: uv run ruff check .
