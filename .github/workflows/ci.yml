# The gate from AGENTS.md, on every pull request and every push to main. A PR merges only once
# both jobs pass (branch protection names `gate` and `python`).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The least disk: no debug info (the global build rules), and no incremental state in CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # commonkit's store declines to publish under 8 GB free, and after the build the runner has
  # less, so blobs (watched audio, large JSON) would never cross (docs/BUGS.md B7, B9).
  COMMONKIT_STORE_MIN_FREE_GB: 2

# Linux only: macOS runners cost too much (maintainer, 2026-11-05). macOS is checked locally.
jobs:
  # The Rust half: fmt, clippy and every test, the test binaries run in parallel by nextest.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA's headers for the audio engine; Mesa's software Vulkan (lavapipe) as the GPU the
      # rendering kittests need, since the runner has none ("No adapter found"). Cached, as
      # Ubuntu's mirrors sometimes take minutes to answer.
      - name: Linux packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev mesa-vulkan-drivers libvulkan1
          version: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # the Rust tests that build Python engines (engine_manifest, generated_engine) use uv
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # every test binary in parallel, each test in its own process; --no-fail-fast lists every
      # failing test in one run. There are no doc tests (cargo test --doc finds none).
      - name: cargo nextest
        run: cargo nextest run --all-features --no-fail-fast

  # The Python SDK's tests and lint: they don't use the Rust build, so they run beside it.
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: pytest
        working-directory: python
        run: uv run pytest

      - name: ruff
        if: ${{ !cancelled() }}
        working-directory: python
        run: uv run ruff check .
